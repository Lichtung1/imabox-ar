<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMABOX</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; }
    model-viewer { width: 100%; height: 100dvh; }
    #ar-btn {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      padding: 16px 32px; font-size: 20px; border: none; border-radius: 30px;
      background: #f26b3a; color: white; font-weight: bold;
    }
  </style>
</head>
<body>
  <model-viewer src="char1.glb" ar ar-modes="scene-viewer webxr quick-look"
    ar-scale="fixed" autoplay camera-controls>
    <button slot="ar-button" id="ar-btn">View on your desk</button>
  </model-viewer>
</body>
</html>
