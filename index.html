<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMABOX</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #222; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100dvh; background: #222; }
    .ar-link {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      padding: 16px 32px; font-size: 20px; border-radius: 30px;
      background: #f26b3a; color: white; font-weight: bold;
      text-decoration: none; white-space: nowrap; z-index: 10;
    }
  </style>
</head>
<body>
  <model-viewer src="char1.glb" ar ar-modes="scene-viewer quick-look webxr"
    ar-scale="fixed" autoplay camera-controls></model-viewer>

  <a class="ar-link"
     href="https://arvr.google.com/scene-viewer/1.0?file=https://lichtung1.github.io/imabox-ar/char1.glb&mode=ar_only">
     View in AR
  </a>
</body>
</html>
